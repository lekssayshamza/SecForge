services:
  postgres:
    image: postgres:18
    container_name: secforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: secforge
      POSTGRES_USER: secforge
      POSTGRES_PASSWORD: secforge_dev_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
